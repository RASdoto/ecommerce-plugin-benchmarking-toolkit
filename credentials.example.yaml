# credentials.yaml — THE ONLY FILE YOU EDIT.
# Copy this file to `credentials.yaml` and fill one block per site.
# Safe to re-edit any time (rotate a password, change a host) — a re-run picks it up.
# The agent auto-provisions everything else (WP-CLI, profiler, app password, admin cookie).
#
# You provide: site URL + admin credentials + SSH access. Nothing else.

fluentcart:
  url:        "https://fc.example.com"    # site base URL                       (required)
  admin_user: "admin"                     # WP admin username                   (required)
  admin_pass: "your-admin-password"       # admin password …                    (required)
  app_password: ""                        # … OR a WP Application Password; blank => agent mints one
  ssh_host:   "fc.example.com"            # SSH host (often the url host)       (required)
  ssh_port:   22
  ssh_user:   "sshuser"                   #                                     (required)
  ssh_key:    "~/.ssh/id_rsa"             # path to SSH key …                   (required: key OR pass)
  ssh_pass:   ""                          # … OR SSH password
  # Optional: REST API keys some load modules use (else agent uses the app password)
  api:
    # WOO_CONSUMER_KEY: ""
    # WOO_CONSUMER_SECRET: ""
    # SURE_API_KEY: ""
    # EDD_API_KEY: ""
    # EDD_API_TOKEN: ""

woo:
  url:        "https://woo.example.com"
  admin_user: "admin"
  admin_pass: "your-admin-password"
  app_password: ""
  ssh_host:   "woo.example.com"
  ssh_port:   22
  ssh_user:   "sshuser"
  ssh_key:    "~/.ssh/id_rsa"
  ssh_pass:   ""
  api:
    # WOO_CONSUMER_KEY: "ck_..."
    # WOO_CONSUMER_SECRET: "cs_..."

